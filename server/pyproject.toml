[project]
name = "blind-frontend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "torch",
    "torchvision",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.7.0.72",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "gTTS>=2.3.0",
    "pyserial>=3.5",
    "easyocr>=1.7.0",
    "python-dotenv>=1.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
override-dependencies = [
    "opencv-python-headless>=4.7.0.72",
]
